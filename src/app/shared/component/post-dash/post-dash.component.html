<div class="container">
    <div class="row">
        <div class="col-md-6 offset-3">
            <app-post-form
            (emitNewPost)="newPostObj($any($event))"
            (emitUpdtPost)="onUpdate($any($event))"></app-post-form>
        </div>
        </div>
        <div class="row">
        <div class="col-md-4 mt-5" *ngFor="let post of postArr">
            <app-post-card [getData]="post"
                (removeemit)="removePost($event)"></app-post-card>
        </div>
    </div>
</div>
