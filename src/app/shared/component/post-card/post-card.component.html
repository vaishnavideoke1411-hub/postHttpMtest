   
<div class="card h-100">
    <div class="card-header">
        {{getData.title}}
    </div>
    <div class="card-body " >
        
        <p> {{getData.body}}</p>
        
            <span> </span>
    </div>
    <div class="card-footer d-flex justify-content-between">
        <button mat-mini-fab color="primary" (click)="onEdit(getData)"><mat-icon>edit</mat-icon></button>
        <button mat-mini-fab class="button" (click)="onRemove(getData.id)"  color="warn"><mat-icon>delete</mat-icon></button>
    </div>
</div>
